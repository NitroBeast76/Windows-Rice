#? Config file for btop4win
#* Minimal Windows-Rice config. Only settings that differ from btop's
#* defaults are listed; everything else is filled in by btop4win on
#* first launch.

#* Use the terminal's own color palette instead of a fixed theme.
#* This means btop follows whichever theme the rice has applied to
#* Windows Terminal — swapping themes in the rice re-colors btop too.
color_theme = "TTY"

#* 24-bit color is supported by Windows Terminal 1.18+.
truecolor = True

#* Graph symbol set. "tty" works on any font; switch to "braille" for
#* higher resolution if your terminal font supports it.
graph_symbol = "tty"

#* Layout: full-width CPU graph on top, memory/network/process below.
cpu_wide = True

#* Show uptime and temperature in the CPU box.
show_uptime = True
check_temp = True
show_coretemp = True

#* Show disk usage in the memory box.
show_disks = True

#* Show battery if present (useful on laptops).
show_battery = True

#* GPU integration requires the Libre Hardware Monitor C++ DLLs, which
#* Windows-Rice does not install. Left disabled by default. If you install
#* the DLLs manually, set enable_ohmr = True and show_gpu = True.
enable_ohmr = False
show_gpu = False